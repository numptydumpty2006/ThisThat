spring:
  application:
    name: this-and-that-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cafe_finder}
    username: ${DATABASE_USERNAME:cafe_user}
    password: ${DATABASE_PASSWORD:cafe_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 3600000   # 1 hour in ms
      cache-null-values: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  forward-headers-strategy: framework

# Application-specific config (read via @ConfigurationProperties later)
app:
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: https://maps.googleapis.com/maps/api/place
  security:
    api-key-header: X-API-Key
    api-key: ${APP_API_KEY:dev-secret-change-me}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
  cache:
    cafe-search-ttl-seconds: 3600   # 1 hour, matches spec

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.this.that: INFO
    org.springframework.web: INFO